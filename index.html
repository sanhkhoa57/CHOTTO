:root[data-theme="light"] h1,:root[data-theme="light"] h2{font-family:"Onest","Segoe UI",system-ui,sans-serif!important;font-weight:800!important;letter-spacing:-.03em!important}
:root[data-theme="light"] .dl{background:radial-gradient(90% 900px at 100% 0%,#ffe3cf,transparent 60%),radial-gradient(80% 900px at 0% 0%,#ebe3fb,transparent 62%),#fbf6f1!important}
:root[data-theme="light"] .card{box-shadow:inset 0 0 0 1px rgba(58,37,71,.07),0 14px 34px -18px rgba(90,50,80,.28)}
:root[data-theme="light"] .btn-w{box-shadow:0 12px 24px -12px rgba(242,138,58,.8)}
:root[data-theme="light"] .beam s{opacity:.55}
/* Công tắc sáng/tối: bầu trời đêm có sao + mặt trăng (tối) <-> trời chiều có mây + mặt trời (sáng). */
.themebtn{--spring:cubic-bezier(.3,1.3,.5,1);position:relative;width:64px;height:32px;padding:0;border:0;border-radius:999px;cursor:pointer;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,#211c16,#2e271e);box-shadow:inset 0 1px 2px rgba(0,0,0,.3),inset 0 0 0 1px rgba(244,239,231,.07);transition:background .8s ease}
.themebtn:hover .tt-knob{transform:translateY(-1px) scale(1.04)}
.themebtn:focus-visible{outline:2px solid var(--k1);outline-offset:3px}
.tt-sky{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tt-sky::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#d6cbf4,#ffdcc4);opacity:0;transition:opacity .8s ease}
.tt-star{position:absolute;width:3px;height:3px;border-radius:50%;background:#f0d9a6;box-shadow:0 0 5px rgba(240,217,166,.6);animation:twinkle 2.6s ease-in-out infinite;transition:transform .8s var(--spring),opacity .6s}
.tt-star:nth-child(2){animation-delay:.9s}.tt-star:nth-child(3){animation-delay:1.7s}
.tt-cloud{position:absolute;width:22px;height:9px;border-radius:9px;background:rgba(255,255,255,.95);opacity:0;transform:translateY(14px);transition:transform .9s var(--spring),opacity .6s}
:root[data-theme="light"] .tt-sky{animation:drift 6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
@keyframes drift{50%{transform:translateX(-2px)}}
.tt-cloud::before,.tt-cloud::after{content:"";position:absolute;bottom:3px;border-radius:50%;background:inherit}
.tt-cloud::before{left:3px;width:10px;height:10px}.tt-cloud::after{left:9px;width:12px;height:12px}
.tt-knob{position:absolute;top:5px;left:37px;width:22px;height:22px;border-radius:50%;background:#efe8dc;overflow:hidden;
  box-shadow:inset -2px -2px 3px rgba(120,100,80,.25),0 2px 6px -1px rgba(0,0,0,.3);transition:left .9s var(--spring),transform .4s var(--spring),background .8s,box-shadow .8s}
.tt-knob i{position:absolute;border-radius:50%;background:#d6ccbb;transition:transform .6s ease,opacity .5s}
.tt-knob i:nth-child(1){left:5px;top:4px;width:7px;height:7px}.tt-knob i:nth-child(2){left:13px;top:11px;width:5px;height:5px}.tt-knob i:nth-child(3){left:6px;top:14px;width:3px;height:3px}
:root[data-theme="light"] .themebtn{background:#ddd2f4;box-shadow:inset 0 1px 2px rgba(90,50,80,.1),inset 0 0 0 1px rgba(58,37,71,.06)}
:root[data-theme="light"] .tt-sky::before{opacity:1}
:root[data-theme="light"] .tt-star{animation:none;opacity:0;transform:translateY(-12px) scale(.3)!important}
:root[data-theme="light"] .tt-cloud{opacity:1;transform:none}
:root[data-theme="light"] .tt-cloud:nth-of-type(5){transform:scale(.8)}
:root[data-theme="light"] .tt-knob{left:5px;background:#f8a75a;box-shadow:inset -2px -2px 3px rgba(196,90,20,.25),0 0 0 4px rgba(255,222,180,.4),0 2px 6px -1px rgba(242,138,58,.4)}
:root[data-theme="light"] .tt-knob i{opacity:0;transform:scale(.2)}
/* Công tắc ngôn ngữ EN/VI: một viên nền trượt nhẹ dưới chữ đang chọn. */
.langtog{--spring:cubic-bezier(.3,1.3,.5,1);position:relative;display:inline-grid;grid-template-columns:1fr 1fr;align-items:center;width:68px;height:32px;padding:4px;border:0;border-radius:999px;cursor:pointer;
  background:var(--k22);box-shadow:inset 0 1px 2px rgba(0,0,0,.18),inset 0 0 0 1px var(--k17);font:600 11px/1 "Onest","Segoe UI",system-ui,sans-serif;letter-spacing:.06em;transition:background .8s ease}
.langtog span{position:relative;z-index:1;text-align:center;color:var(--k23);opacity:.8;transition:color .7s ease,opacity .7s ease}
/* translate = vị trí, scale = co giãn: hai thuộc tính riêng nên trượt và "dẻo" chồng lên nhau được. */
.lt-thumb{position:absolute;top:4px;left:4px;width:30px;height:24px;border-radius:999px;background:var(--k1);box-shadow:0 2px 6px -1px rgba(0,0,0,.28);
  transition:translate .9s var(--spring),scale .4s var(--spring),box-shadow .4s ease}
.langtog:hover .lt-thumb{scale:1.05;box-shadow:0 3px 8px -1px rgba(0,0,0,.3)}
.langtog[data-lang="vi"] .lt-thumb{translate:30px 0}
.langtog.moving .lt-thumb{animation:lt-stretch .9s var(--spring)}
@keyframes lt-stretch{30%{scale:1.28 .9}65%{scale:.96 1.04}}
.langtog[data-lang="en"] span[lang="en"],.langtog[data-lang="vi"] span[lang="vi"]{color:var(--k7);opacity:1}
.langtog:focus-visible{outline:2px solid var(--k1);outline-offset:3px}
/* Mascot: sân khấu + bốn trạng thái (ngủ, chạy, giật mình, "Khoan đã!"), mỗi trạng thái một hoạt ảnh riêng. */
.mastates{display:grid;gap:4px}
.mastate{all:unset;box-sizing:border-box;display:grid;grid-template-columns:10px 1fr;column-gap:16px;padding:14px 16px;border-radius:16px;cursor:pointer;transition:background .35s ease}
.mastate::before{content:"";width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--k17);transition:background .3s,transform .4s cubic-bezier(.3,1.4,.5,1)}
.mastate strong{display:block;font-weight:500;font-size:17px}
.mastate span{display:block;margin-top:2px;font-size:15px;color:var(--k21)}
.mastate:hover{background:var(--k29)}
.mastate[aria-selected="true"]{background:var(--k29)}
.mastate[aria-selected="true"]::before{background:var(--k1);transform:scale(1.35)}
.mastate:focus-visible{outline:2px solid var(--k1);outline-offset:2px}
.mastage{position:relative;height:380px;overflow:hidden;background:radial-gradient(70% 60% at 50% 100%,var(--k29),transparent 72%)}
.ma-pos{position:absolute;left:50%;bottom:46px;width:0;height:0}
.ma-img{position:absolute;left:0;bottom:0;transform:translateX(-50%);transform-origin:50% 100%;height:200px;width:auto;image-rendering:auto;user-select:none;-webkit-user-drag:none}
.mastage[data-s="run"] .ma-img{height:190px}
.mastage[data-s="stop"] .ma-img{height:172px}
.ma-bar{position:absolute;left:18px;right:18px;bottom:14px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--k22);box-shadow:inset 0 0 0 1px var(--k17)}
.ma-bar i{width:18px;height:18px;border-radius:5px;background:var(--k17)}
.ma-bar i.on{background:var(--k1);opacity:.85}
.ma-chip{position:absolute;top:22px;right:22px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--k73);color:var(--k65);box-shadow:inset 0 0 0 1px var(--k75);opacity:0;transform:translateY(8px) scale(.9);transition:opacity .35s ease,transform .5s cubic-bezier(.3,1.4,.5,1)}
.mastage[data-s="alert"] .ma-chip,.mastage[data-s="stop"] .ma-chip{opacity:1;transform:none}
/* ngủ: thở chậm */
.mastage[data-s="sleep"] .ma-img{animation:ma-breath 3.4s ease-in-out infinite}
@keyframes ma-breath{50%{transform:translateX(-50%) scale(1.012,1.026)}}
/* chạy: tuần tra qua lại, quay đầu ở hai mép, thân nảy theo nhịp chân */
.mastage[data-s="run"] .ma-pos{animation:ma-run 3.6s linear infinite}
.mastage[data-s="run"] .ma-img{animation:ma-bob .32s ease-in-out infinite alternate}
@keyframes ma-run{0%{transform:translateX(-120px) scaleX(-1)}49.5%{transform:translateX(120px) scaleX(-1)}50%{transform:translateX(120px) scaleX(1)}99.5%{transform:translateX(-120px) scaleX(1)}100%{transform:translateX(-120px) scaleX(-1)}}
@keyframes ma-bob{to{transform:translateX(-50%) translateY(-7px) rotate(1.2deg)}}
/* giật mình: bật lên rồi đáp xuống, co dẹt khi chạm đất */
.mastage[data-s="alert"] .ma-img{animation:ma-jump .75s cubic-bezier(.3,1.3,.5,1) both}
@keyframes ma-jump{0%{transform:translateX(-50%) scale(1.06,.9)}30%{transform:translateX(-50%) translateY(-34px) scale(.94,1.08)}62%{transform:translateX(-50%) scale(1.07,.9)}100%{transform:translateX(-50%)}}
/* Khoan đã!: giơ tay, đứng yên, tay hơi lắc */
.mastage[data-s="stop"] .ma-img{animation:ma-stop .55s cubic-bezier(.3,1.4,.5,1) both,ma-wave 1.3s ease-in-out .55s infinite;transform-origin:20% 100%}
@keyframes ma-stop{from{transform:translateX(-50%) scale(.85)}to{transform:translateX(-50%) scale(1)}}
@keyframes ma-wave{50%{transform:translateX(-50%) rotate(-1.6deg)}}
@media (prefers-reduced-motion:reduce){.mastage *{animation:none!important}.ma-chip,.mastate::before{transition:none}}
/* Viền mực nhẹ quanh các thành phần (theo nét truyện tranh): đen tím ở giao diện sáng, kem mờ ở giao diện tối. */
:root{--edge:rgba(244,239,231,.2);--hot:#fff}                    /* --hot: chữ nhấn/hover: trắng ở tối, đen tím ở sáng */
:root[data-theme="light"]{--edge:rgba(43,25,56,.55);--hot:#2b1938}
.card,.btn,.bar,.langtog,.key,figure[role="img"],.cap{outline:1.5px solid var(--edge);outline-offset:-1.5px}
.btn:focus-visible,.langtog:focus-visible,.themebtn:focus-visible,.cap:focus-visible{outline:2px solid var(--k1);outline-offset:3px}
/* Nút sáng/tối có nền trời + nút tròn nằm đè lên viền outline, nên vẽ viền bằng lớp phủ nằm trên cùng. */
.themebtn::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px var(--edge);pointer-events:none;z-index:5}
/* Đổi ngôn ngữ: ngôn ngữ mới loang thành vòng tròn từ công tắc (như nút sáng/tối); vòng tròn tới đâu chữ đổi tới đó.
   Công tắc tách khỏi ảnh chụp chung để viên nền trượt thật, không bị vòng loang che. */
.langtog{view-transition-name:langtog}
::view-transition-old(langtog){display:none}
::view-transition-new(langtog){animation:none}
/* Loang: giao diện mới mở rộng thành vòng tròn từ công tắc (View Transitions). */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
@media (prefers-reduced-motion:reduce){.themebtn,.themebtn *,.themebtn *::before,.langtog *{transition:none!important;animation:none!important}}
body{margin:0;background:var(--k0);caret-color:var(--k1)}
::selection{background:var(--k2);color:var(--k3)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--k0)}::-webkit-scrollbar-thumb{background:var(--k4);border-radius:999px;border:3px solid var(--k0)}::-webkit-scrollbar-thumb:hover{background:var(--k5)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a{color:var(--k6);text-decoration:none}a:hover{color:var(--k3)}
.dl{font-feature-settings:"calt","kern","liga","ss03"}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.btn{border-radius:999px!important;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border:0;border-radius:8px;font:500 15px/1 "Onest","Segoe UI",system-ui,sans-serif;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:transform .2s cubic-bezier(.2,.7,.2,1),background .2s,box-shadow .2s,color .2s,opacity .2s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-w{background:var(--k1);color:var(--k7);font-weight:600}
.btn-w:hover{background:var(--k8);color:var(--k7);transform:translateY(-1px);box-shadow:0 0 0 4px var(--k9),0 8px 30px -6px var(--k10)}
.btn-g{background:var(--k11);color:var(--k6);box-shadow:inset 0 0 0 1px var(--k12)}
.btn-g:hover{box-shadow:inset 0 0 0 1px var(--k13);color:var(--hot)}
.btn-o{background:transparent;color:var(--k6);box-shadow:inset 0 0 0 1px var(--k14)}
.btn-o:hover{box-shadow:inset 0 0 0 1px var(--k15);color:var(--hot)}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible,.cap:focus-visible,.langbtn:focus-visible,.langitem:focus-visible{outline:2px solid var(--k1);outline-offset:3px}
.bar{background:var(--k16);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 0 0 1px var(--k17),inset 0 1px 0 var(--k17),0 10px 30px -10px var(--k18),0 24px 60px -24px var(--k19);transition:background .3s,box-shadow .3s}
.bar:hover{background:var(--k20)}
.navl{font-size:14px;font-weight:500;color:var(--k21);letter-spacing:.2px;transition:color .15s}
.navl:hover{color:var(--k3)}

/* chuyển ngôn ngữ */
.langbtn{height:38px;padding:0 9px 0 11px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;background:var(--k22);color:var(--k23);font:500 13px/1 "Onest","Segoe UI",system-ui,sans-serif;letter-spacing:.3px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--k17);transition:background .2s,color .2s}
.langbtn:hover{background:var(--k24);color:var(--hot)}
.langbtn .chev{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.langbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langmenu{position:absolute;right:0;top:100%;padding-top:10px;animation:menuIn .22s cubic-bezier(.16,1,.3,1) both}
.langbox{min-width:168px;padding:6px;border-radius:14px;background:var(--k25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px var(--k26),0 20px 50px -12px var(--k27)}
.langitem{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--k28);font:500 14px/1 "Onest","Segoe UI",system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.langitem:hover{background:var(--k29);color:var(--hot)}
.langitem[aria-checked="true"]{color:var(--hot)}

/* thẻ có viền sáng chạy theo chuột */

  setInterval(function () {
    var url = URLS[st.s];
    if (st.ch < url.length) st.ch = Math.min(url.length, st.ch + 2);
    else if (st.t < 110) st.t += 1;
    else { st.s = (st.s + 1) % URLS.length; st.ch = 0; st.t = 0; }
    renderDemo();
  }, 40);

  // ---------- phím Esc ----------
  var cap = $('#escCap'), win = $('#winBox'), busy = false;
  cap.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    cap.classList.add('down');
    win.classList.add('winHide');
    setTimeout(function () { cap.classList.remove('down'); }, 180);
    setTimeout(function () { win.classList.remove('winHide'); busy = false; }, 1500);
  });

  // ---------- cuộn mượt + sáng mục trên thanh menu ----------
  var ids = ['cach-hoat-dong', 'tai-xuong', 'cai-dat', 'hoi-dap'];
  var navLock = false, navT = 0;
  function onScroll() {
    if (navLock) return;
    var cur = '';
    ids.forEach(function (id) { var el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= innerHeight * 0.4) cur = id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = ids[ids.length - 1];
    if (cur !== st.sec) { st.sec = cur; renderNav(); }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = (a.getAttribute('href') || '').slice(1);
    var el = id && document.getElementById(id);
    if (!el) return;
    e.preventDefault();
    var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    navLock = true;
    clearTimeout(navT);
    navT = setTimeout(function () { navLock = false; onScroll(); }, 1100);
    st.sec = id; renderNav();
  });
  window.addEventListener('scroll', onScroll, { passive: true });

  // ---------- khởi động ----------
  renderText();
  setMascot(0, false);
  renderNav();
  onScroll();

  // ---------- hiện dần khi cuộn tới ----------
  try {
    document.documentElement.classList.add('rv-on');
    var els = $$('.rv');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
      els.forEach(function (el) { io.observe(el); });
    } else { els.forEach(function (el) { el.classList.add('shown'); }); }
    setTimeout(function () { $$('.rv').forEach(function (el) { if (el.getBoundingClientRect().top < innerHeight) el.classList.add('shown'); }); }, 1200);
  } catch (e) {}
})();
</script>

<div class="mx" id="mx">
  <div class="mx-bub" id="mxBub" data-k="normal" role="status" aria-live="polite" hidden></div>
  <form class="mx-form" id="mxForm" autocomplete="off" hidden>
    <input id="mxIn" type="text" maxlength="150" placeholder="Dán link nghi ngờ hoặc hỏi về Chotto..." aria-label="Hỏi Chotto">
    <button type="submit" id="mxSend">Gửi</button>
    <button type="button" class="mx-x" id="mxClose" aria-label="Đóng (Esc)">✕</button>
  </form>
  <button type="button" class="mx-who" id="mxWho" aria-label="Chotto, linh vật chống lừa đảo. Nhấn đúp hoặc nhấn Enter để hỏi đáp, soi link"><img id="mxImg" src="chotto/mascot/assets/web/pose_0.png" alt="" width="254" height="508" decoding="async"></button>
  <p class="mx-hint">Double-click vào tui để hỏi đáp / soi link</p>
</div>

<script>
/* ---------- mascot chat: lời thoại theo ngữ cảnh (0 token, chạy hoàn toàn ở trình duyệt) + hỏi đáp qua /api/mascot-chat ---------- */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var bub = $('#mxBub'), form = $('#mxForm'), inp = $('#mxIn'), send = $('#mxSend'), who = $('#mxWho'), img = $('#mxImg');
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  // ----- bộ lọc đầu vào (PHẢI khớp api/mascot-chat.js) -----
  var MIN_LEN = 4, MAX_LEN = 150, DAILY = 6;
  var DOMAIN_RE = /(https?:\/\/|www\.)\S+|[a-z0-9-]+\.(vn|com|top|xyz|net|org|info|click|site|online|tk|me|io|app)(?![a-z0-9])/i;
  var KEYWORDS = ['chotto', 'scam', 'lừa đảo', 'giả mạo', 'phishing', 'link', 'url', 'tên miền', 'domain', 'mã độc', 'virus', 'trojan', 'hack',
    'mất nick', 'chiếm quyền', 'zalo', 'messenger', 'facebook', 'telegram', 'ngân hàng', 'vietcombank', 'mbbank', 'techcombank', 'momo', 'shopee',
    'shipper', 'sinh trắc', 'cài đặt', 'tải về', 'download', 'windows', 'macos', 'mac', 'arm', 'x86', 'extension', 'tiện ích', 'trình duyệt',
    'miễn phí', 'free', 'nhẹ', 'ram', 'bảo mật', 'an toàn', 'chặn'];
  var BLACKLIST = ['viết code', 'giải bài', 'dịch sang', 'tóm tắt', 'viết văn', 'làm thơ', 'kể chuyện', 'sql', 'python', 'javascript', 'bài tập'];
  function hasKeyword(text, w) {
    if (/^[a-z0-9 ]+$/.test(w)) return new RegExp('(^|[^a-z0-9])' + w + '([^a-z0-9]|$)').test(text);
    return text.indexOf(w) >= 0;
  }
  function checkInput(raw) {
    var s = String(raw).trim();
    if (s.length < MIN_LEN || s.length > MAX_LEN) return false;
    var low = s.toLowerCase();
    if (BLACKLIST.some(function (b) { return low.indexOf(b) >= 0; })) return false;
    return DOMAIN_RE.test(s) || KEYWORDS.some(function (k) { return hasKeyword(low, k); });
  }

  // ----- lời thoại -----
  var LINES = {
    hello: 'Chào đằng ấy! Tui là Chotto. Bấm đúp vào tui nếu muốn soi link lạ hay hỏi gì về app nha!',
    hoverTrap: 'KHOAN ĐÃ! Nhìn cái đuôi .xacthuc-tk.top kia kìa, ngân hàng nào xài tên miền phèn vậy?!',
    clickTrap: 'Á À BẮT QUẢ TANG! Tay nhanh hơn não rồi nha, bấm Esc quay xe gấp!',
    esc: 'Pha xử lý cồng kềnh nhưng an toàn. Cài Chotto vào máy là lần sau tui tự chặn giùm luôn!',
    download: 'Cài đi bạn ơi, nhẹ hơn cả tình cảm người cũ dành cho bạn, 0đ không quảng cáo!',
    idle: ['Đang soi code xem uy tín không đúng hông? Sạch 100%, không giấu malware đâu mà lo...',
           'Không biết hôm nay có ai suýt chuyển khoản nhầm cho "shipper" nữa không ta...'],
    open: 'Dán link nghi ngờ vào đây, tui soi cho!',
    loading: 'Đang soi...',
    refuse: ['HỎI LẠC ĐỀ RỒI! Tui là vệ sĩ chống scam của Chotto, không phải trợ lý làm bài tập hay chém gió đâu nha!',
             'Khoan! Câu này không liên quan tới Chotto hay link lừa đảo. Dán thử một đường link nghi ngờ vào đây tui soi cho!',
             'Từ chối tiếp nhận! Tui chỉ rành bóc phốt link bẩn với giải đáp về app Chotto thôi.'],
    quota: 'Nay tui tư vấn hết công suất rồi! Tải Chotto về máy trải nghiệm trực tiếp cho lẹ nha.',
    fail: 'Hôm nay tui soi nhiều link quá nên hơi lag não, bạn bấm tải Chotto về dùng thử cho trực quan nha!'
  };
  var POSE = { sleep: 0, startled: 1, run: 2, stop: 3 };
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };

  // ----- vẽ bong bóng: SVG dựng theo kích thước chữ; bóng đổ = chấm bi lệch (7,7) -----
  function superPts(cx, cy, a, b, n) {                                  // điểm trên hình "chữ nhật bo tròn" (siêu elip) theo chiều kim đồng hồ
    var pts = [];
    for (var i = 0; i < n; i++) {
      var t = (i / n) * Math.PI * 2 - Math.PI / 2, c = Math.cos(t), s = Math.sin(t);
      pts.push([cx + a * Math.sign(c) * Math.pow(Math.abs(c), 2 / 3), cy + b * Math.sign(s) * Math.pow(Math.abs(s), 2 / 3)]);
    }
    return pts;
  }
  function shape(kind, w, h) {
    var x0 = 4, y0 = 4, x1 = w - 12, y1 = h - 26, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, a = (x1 - x0) / 2, b = (y1 - y0) / 2, d = '', extra = '', i;
    if (kind === 'thought') {
      var n = Math.max(10, Math.round((w + h) / 26)), P = superPts(cx, cy, a - 8, b - 8, n);
      d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
      for (i = 1; i <= n; i++) {
        var q = P[i % n], p = P[i - 1], r = Math.hypot(q[0] - p[0], q[1] - p[1]) * 0.62;
        d += 'A' + r.toFixed(1) + ' ' + r.toFixed(1) + ' 0 0 1 ' + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
      }
      d += 'Z';
      extra = 'M' + (x1 - 26) + ' ' + (y1 + 10) + 'm-8 0a8 8 0 1 0 16 0a8 8 0 1 0-16 0Z M' + (x1 - 8) + ' ' + (y1 + 22) + 'm-5 0a5 5 0 1 0 10 0a5 5 0 1 0-10 0Z';
    } else if (kind === 'alert') {
      var m = Math.max(10, Math.min(20, Math.round((w + h) / 34))) * 2, P2 = superPts(cx, cy, a + 8, b + 8, m), pts = [];
      for (i = 0; i < m; i++) {
        var f = i % 2 ? 0.8 : 1.04, pp = P2[i];
        pts.push([(cx + (pp[0] - cx) * f).toFixed(1), (cy + (pp[1] - cy) * f).toFixed(1)]);
      }
      d = 'M' + pts.map(function (p) { return p.join(' '); }).join('L') + 'Z';
      var sx = x0 + 14, sy = y0 - 2, st = [];
      for (i = 0; i < 10; i++) { var rr = i % 2 ? 6 : 15, an = (i / 10) * Math.PI * 2 - Math.PI / 2; st.push((sx + rr * Math.cos(an)).toFixed(1) + ' ' + (sy + rr * Math.sin(an)).toFixed(1)); }
      extra = 'M' + st.join('L') + 'Z';
    } else {
      var r0 = 22, tr = x1 - 34, tl = x1 - 66;
      d = 'M' + (x0 + r0) + ' ' + y0 + 'H' + (x1 - r0) + 'Q' + x1 + ' ' + y0 + ' ' + x1 + ' ' + (y0 + r0) + 'V' + (y1 - r0) + 'Q' + x1 + ' ' + y1 + ' ' + (x1 - r0) + ' ' + y1 +
        'H' + tr + 'L' + (x1 - 22) + ' ' + (y1 + 22) + 'L' + tl + ' ' + y1 + 'H' + (x0 + r0) + 'Q' + x0 + ' ' + y1 + ' ' + x0 + ' ' + (y1 - r0) + 'V' + (y0 + r0) + 'Q' + x0 + ' ' + y0 + ' ' + (x0 + r0) + ' ' + y0 + 'Z';
    }
    return { d: d, extra: extra };
  }
  function draw() {
    var old = bub.querySelector('svg'); if (old) old.remove();
    var w = bub.offsetWidth, h = bub.offsetHeight; if (!w || !h) return;
    var sh = shape(bub.getAttribute('data-k'), w, h);
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + w + ' ' + h); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = '<defs><pattern id="mxDots" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="2.5" cy="2.5" r="1.3" style="fill:var(--mx-dot)"/></pattern></defs>' +
      '<g transform="translate(7 7)" fill="url(#mxDots)"><path d="' + sh.d + '"/>' + (sh.extra ? '<path d="' + sh.extra + '"/>' : '') + '</g>' +
      '<g fill="#fff" stroke="#15101a" stroke-width="3" stroke-linejoin="round"><path d="' + sh.d + '"/>' + (sh.extra ? '<path d="' + sh.extra + '"/>' : '') + '</g>';
    bub.insertBefore(s, bub.firstChild);
  }

  // ----- nói: đổi kiểu, đổi pose, nảy lên, gõ chữ -----
  var typeT = 0, hideT = 0, busy = false;
  function say(kind, text, pose, keep) {
    clearTimeout(typeT); clearTimeout(hideT);
    bub.setAttribute('data-k', kind); bub.hidden = false;
    img.src = 'chotto/mascot/assets/web/pose_' + pose + '.png';
    bub.innerHTML = '<span class="mx-t"><span></span><i></i></span>';
    var a = bub.querySelector('.mx-t span'), b = bub.querySelector('.mx-t i'), ch = Array.from(text), n = calm ? ch.length : 0;
    a.textContent = ch.slice(0, n).join(''); b.textContent = ch.slice(n).join('');       // chữ chưa gõ vẫn chiếm chỗ (ẩn) nên bong bóng không đổi cỡ
    draw();
    bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop');
    function done() { if (!keep && form.hidden) hideT = setTimeout(function () { bub.hidden = true; img.src = 'chotto/mascot/assets/web/pose_0.png'; }, 9000); }
    (function step() {
      if (n >= ch.length) return done();
      n++; a.textContent = ch.slice(0, n).join(''); b.textContent = ch.slice(n).join('');
      typeT = setTimeout(step, 16);
    })();
  }
  window.addEventListener('resize', function () { if (!bub.hidden) draw(); });

  // ----- tình huống -----
  var last = {};
  function once(key, gap) { var t = Date.now(); if (last[key] && t - last[key] < gap) return false; last[key] = t; return true; }
  function chatOpen() { return !form.hidden; }
  var trapped = false, idleT = 0;
  function bumpIdle() { clearTimeout(idleT); idleT = setTimeout(function () { if (!chatOpen() && !busy) say('thought', pick(LINES.idle), POSE.sleep); }, 15000); }
  ['mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, bumpIdle, { passive: true }); });
  bumpIdle();
  setTimeout(function () { if (!chatOpen()) say('normal', LINES.hello, POSE.stop); }, 900);

  var trap = $('#trapLink');
  if (trap) {
    trap.addEventListener('mouseenter', function () { if (!chatOpen() && once('hover', 4000)) say('alert', LINES.hoverTrap, POSE.stop); });
    trap.addEventListener('click', function () { if (chatOpen()) return; trapped = true; say('alert', LINES.clickTrap, POSE.startled); });
  }
  var escCap = $('#escCap');
  function escaped() { if (chatOpen()) return; trapped = false; say('normal', LINES.esc, POSE.stop); }
  if (escCap) escCap.addEventListener('click', escaped);
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest && e.target.closest('a[href="#tai-xuong"].btn, #platforms [data-p="cta"]');
    if (t && !chatOpen() && once('dl', 6000)) say('normal', LINES.download, POSE.stop);
  });

  // ----- hỏi đáp -----
  function quota() {
    var day = new Date().toISOString().slice(0, 10), q = { d: day, n: 0 };
    try { var s = JSON.parse(localStorage.getItem('chotto-mascot-quota') || 'null'); if (s && s.d === day && s.n >= 0) q = s; } catch (e) {}
    return q;
  }
  function openChat() {
    form.hidden = false; clearTimeout(hideT);
    say('normal', LINES.open, POSE.stop, true);
    inp.focus();
  }
  function closeChat() {
    form.hidden = true; busy = false; inp.disabled = send.disabled = false; inp.value = '';
    if (!bub.hidden) hideT = setTimeout(function () { bub.hidden = true; img.src = 'chotto/mascot/assets/web/pose_0.png'; }, 3000);
    who.focus();
  }
  who.addEventListener('dblclick', openChat);
  who.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); openChat(); } });
  $('#mxClose').addEventListener('click', closeChat);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (chatOpen()) { closeChat(); return; }
    if (trapped) escaped();
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var v = inp.value.trim();
    if (!checkInput(v)) { say('alert', pick(LINES.refuse), POSE.startled, true); return; }        // trượt bộ lọc: không gọi API
    var q = quota();
    if (q.n >= DAILY) { say('normal', LINES.quota, POSE.stop, true); return; }
    q.n++; try { localStorage.setItem('chotto-mascot-quota', JSON.stringify(q)); } catch (err) {}
    busy = true; inp.disabled = send.disabled = true;
    say('thought', LINES.loading, POSE.run, true);
    var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 20000);
    fetch('/api/mascot-chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: v }), signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        if (!j || typeof j.reply !== 'string') throw new Error('shape');
        var al = j.bubbleType === 'alert';
        say(al ? 'alert' : 'normal', j.reply, al ? POSE.startled : POSE.stop, true);
      })
      .catch(function () { say('normal', LINES.fail, POSE.stop, true); })
      .then(function () { clearTimeout(to); busy = false; inp.disabled = send.disabled = false; inp.value = ''; if (chatOpen()) inp.focus(); });
  });
})();
</script>
</body>
