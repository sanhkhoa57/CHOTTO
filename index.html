<head>

<style>
body{margin:0;background:#05070b}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
a{color:#f3f5fa;text-decoration:none}a:hover{color:#ffffff}
.dl{font-feature-settings:"calt","kern","liga","ss03"}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;padding:0 20px;border:0;border-radius:8px;font:500 15px/1 "Inter",system-ui,sans-serif;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:transform .2s cubic-bezier(.2,.7,.2,1),background .2s,box-shadow .2s,color .2s,opacity .2s}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-w{background:#ffffff;color:#05070b}
.btn-w:hover{background:#ffffff;color:#05070b;box-shadow:0 0 0 4px rgba(120,165,255,.18),0 8px 30px -6px rgba(77,141,255,.55)}
.btn-g{background:#10141c;color:#f3f5fa;box-shadow:inset 0 0 0 1px #1f2633}
.btn-g:hover{box-shadow:inset 0 0 0 1px #3a4a66;color:#fff}
.btn-o{background:transparent;color:#f3f5fa;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.btn-o:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);color:#fff}
.btn:focus-visible,.tab:focus-visible,summary:focus-visible,.cap:focus-visible,.langbtn:focus-visible,.langitem:focus-visible{outline:2px solid #6fa0ff;outline-offset:3px}
.bar{background:rgba(14,18,26,.62);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px -10px rgba(0,0,0,.85),0 24px 60px -24px rgba(46,110,255,.25);transition:background .3s,box-shadow .3s}
.bar:hover{background:rgba(16,21,30,.78)}
.navl{font-size:14px;font-weight:500;color:#aab3c5;letter-spacing:.2px;transition:color .15s}
.navl:hover{color:#ffffff}

/* chuyển ngôn ngữ */
.langbtn{height:38px;padding:0 9px 0 11px;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;background:rgba(255,255,255,.06);color:#dfe5f1;font:500 13px/1 "Inter",system-ui,sans-serif;letter-spacing:.3px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .2s,color .2s}
.langbtn:hover{background:rgba(255,255,255,.11);color:#fff}
.langbtn .chev{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.langbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.langmenu{position:absolute;right:0;top:100%;padding-top:10px;animation:menuIn .22s cubic-bezier(.16,1,.3,1) both}
.langbox{min-width:168px;padding:6px;border-radius:14px;background:rgba(13,17,25,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 20px 50px -12px rgba(0,0,0,.9)}
.langitem{display:flex;justify-content:space-between;align-items:center;gap:20px;width:100%;height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#bcc5d6;font:500 14px/1 "Inter",system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.langitem:hover{background:rgba(255,255,255,.07);color:#fff}
.langitem[aria-checked="true"]{color:#fff}

/* thẻ có viền sáng chạy theo chuột */
.card{--mx:50%;--my:-30%;position:relative;isolation:isolate;background:#0a0d13;border-radius:12px;box-shadow:inset 0 0 0 1px #1a202b;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(77,141,255,.13),transparent 60%);opacity:0;transition:opacity .4s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(140,180,255,.9),rgba(77,141,255,.25) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s}
.card:hover::before,.card:hover::after{opacity:1}

/* phím 3D */
.cap{position:relative;display:inline-grid;place-items:center;border:0;cursor:pointer;color:#dfe5f1;font:500 22px/1 "Inter",system-ui,sans-serif;border-radius:16px;background:linear-gradient(180deg,#1b212d,#11151d);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.6),0 0 0 1px #262e3d,0 10px 0 -2px #070a0f,0 10px 0 -1px #1b2230,0 24px 40px -12px rgba(0,0,0,.9);transition:transform .56s cubic-bezier(.34,1.56,.64,1),box-shadow .56s cubic-bezier(.34,1.56,.64,1)}
.cap::before{content:"";position:absolute;inset:-4px;z-index:-1;border-radius:20px;padding:2px;opacity:0;background:#ffffff;box-shadow:0 0 30px 6px rgba(255,255,255,.65);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .4s ease}
.cap:active,.cap.down{transform:translateY(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.6),0 0 0 1px #2c4f9e,0 2px 0 -1px #1b2230,0 6px 24px -6px rgba(77,141,255,.6);transition:transform .08s cubic-bezier(.3,0,.5,1),box-shadow .08s cubic-bezier(.3,0,.5,1)}
.cap:active::before,.cap.down::before{opacity:1}
.key{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:5px;background:linear-gradient(180deg,#171c26,#0f131a);box-shadow:inset 0 0 0 1px #262e3d,inset 0 -1px 0 #05070b;font-size:12px;color:#c6cedd;font-weight:500}

.tab{height:36px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#aab3c5;font:500 14px/1 "Inter",system-ui,sans-serif;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{color:#fff}
details{border-top:1px solid #161c26}
details:last-of-type{border-bottom:1px solid #161c26}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 0;font-size:18px;font-weight:500;letter-spacing:.2px;color:#f3f5fa}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;font-weight:400;color:#7d879b;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}

/* thanh kính trong hero */
.beam{position:absolute;left:-5%;right:-5%;height:72px;border-radius:2px;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.beam i{position:absolute;inset:0;background:linear-gradient(90deg,transparent 2%,rgba(29,71,201,.85) 24%,#7fb0ff 47%,#e6efff 50%,#7fb0ff 53%,rgba(33,82,220,.85) 76%,transparent 98%);background-size:220% 100%;animation:sweep 8s cubic-bezier(.45,0,.55,1) infinite alternate}
.beam b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 35%,rgba(0,0,0,.25));mix-blend-mode:overlay}
.beam s{position:absolute;inset:-30px 0;background:inherit;filter:blur(30px);opacity:.8}

@keyframes sweep{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes wordIn{from{opacity:0;filter:blur(12px);transform:translateY(14px)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:0;transform:perspective(1600px) rotateX(18deg) translateY(80px) scale(.94)}to{opacity:1;transform:perspective(1600px) rotateX(0) translateY(0) scale(1)}}
@keyframes caret{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes travel{from{left:0%}to{left:100%}}
.winBox{transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),filter .45s cubic-bezier(.4,0,.2,1)}
.winBox.winHide{opacity:0;transform:scale(.94) translateY(10px);filter:blur(6px)}
.word{display:inline-block;animation:wordIn .9s cubic-bezier(.16,1,.3,1) both}
.lift{animation:lift 1.4s cubic-bezier(.16,1,.3,1) .5s both}
.fade{animation:wordIn 1s cubic-bezier(.16,1,.3,1) both}
.rv-on .rv{opacity:0;filter:blur(1.5px);transform:translateY(16px);transition:opacity .7s cubic-bezier(.16,1,.3,1),filter .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.rv-on .rv.shown{opacity:1;filter:blur(0);transform:none}
@media (prefers-reduced-motion:reduce){.word,.lift,.fade,.beam i,.dot,.langmenu,.cap::before{animation:none!important}.rv-on .rv{opacity:1!important;filter:none!important;transform:none!important}.beam{transition:none!important}}
@media (max-width:760px){.wrap{padding:0 16px}.hidem{display:none!important}}
</style>
</head>

      li.innerHTML = '<span aria-hidden="true"></span><div><strong style="display: block; font-weight: 500; font-size: 17px"></strong><span style="display: block; margin-top: 2px; font-size: 15px; color: #aab3c5"></span></div>';
      li.addEventListener('mouseenter', function () { st.step = i; renderSteps(); });
      $('#steps').appendChild(li);

      var f = document.createElement('div');
      f.style.borderBottom = '1px solid #161c26';
      f.innerHTML = '<button type="button" style="all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 24px 0; cursor: pointer; font-size: 18px; font-weight: 500; color: #ffffff"><span></span><span aria-hidden="true">+</span></button>' +
        '<div><div><p style="margin: 0 0 24px; color: #aab3c5; max-width: 40em; font-size: 16px; line-height: 1.6"></p></div></div>';
      f.querySelector('button').addEventListener('click', function () { st.faq = st.faq === i ? -1 : i; renderFaq(); });
      $('#faqs').appendChild(f);
    })(i);
  }

  $$('.card').forEach(function (c) { c.addEventListener('mousemove', glow); });

  // ---------- vẽ theo trạng thái ----------
  function renderSteps() {
    $$('#tabs .tab').forEach(function (b) {
      var on = b.getAttribute('data-tab') === st.tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.setAttribute('style', 'border-radius: 0; padding: 8px 0; margin-right: 22px; ' + (on ? 'color: #ffffff; box-shadow: inset 0 -2px 0 #9cc0ff' : 'color: #8a93a6; box-shadow: none'));
    });
    var list = T.steps[st.tab];
    $$('#steps li').forEach(function (li, i) {
      var on = i === st.step;
      li.setAttribute('style', 'display:flex; gap:16px; padding:18px 0; cursor:pointer; transition: opacity .35s; opacity:' + (on ? 1 : 0.45));
      li.children[0].setAttribute('style', 'width:8px; height:8px; border-radius:50%; flex:none; margin-top:9px; background:' + (on ? '#9cc0ff' : '#2a3140') + '; transition: background .3s');
      li.querySelector('strong').textContent = list[i][0];
      li.querySelector('div > span').textContent = list[i][1];
    });
  }

  function renderFaq() {
    $$('#faqs > div').forEach(function (f, i) {
      var open = st.faq === i;
      var btn = f.querySelector('button');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.children[0].textContent = T['q' + (i + 1)];
      btn.children[1].setAttribute('style', 'flex: none; font-size: 22px; line-height: 1; color: #8a93a6; transition: transform .45s cubic-bezier(.16,1,.3,1); transform: ' + (open ? 'rotate(45deg)' : 'rotate(0deg)'));
      var wrap = f.children[1];
      wrap.setAttribute('style', 'display: grid; grid-template-rows: ' + (open ? '1fr' : '0fr') + '; transition: grid-template-rows .45s cubic-bezier(.16,1,.3,1)');
      wrap.children[0].setAttribute('style', 'min-height: 0; overflow: hidden; opacity: ' + (open ? 1 : 0) + '; transition: opacity .35s');
      wrap.querySelector('p').textContent = T['a' + (i + 1)];
    });
  }

  function renderNav() {
    $$('[data-nav]').forEach(function (a) {
      a.setAttribute('style', a.getAttribute('data-nav') === st.sec
        ? 'color: #ffffff; text-decoration: underline; text-decoration-color: #9cc0ff; text-decoration-thickness: 2px; text-underline-offset: 8px; transition: color .15s'
        : 'transition: color .15s');
    });
  }

  function renderText() {
    T = dict(st.lang);
    document.documentElement.lang = st.lang;
    $$('[data-t]').forEach(function (el) { el.textContent = T[el.getAttribute('data-t')]; });
    $$('[data-ta]').forEach(function (el) {
      var p = el.getAttribute('data-ta').split(':');
      el.setAttribute(p[0], T[p[1]]);
    });
    $$('[data-hero-label]').forEach(function (el) { el.textContent = os === 'mac' ? T.dlMac : T.dlWin; });
    $$('[data-plat]').forEach(function (card) {
      var p = T.plat[card.getAttribute('data-plat')];
      $$('[data-p]', card).forEach(function (el) { el.textContent = p[el.getAttribute('data-p')]; });
      card.querySelector('[data-p="cta"]').setAttribute('href', p.href);
    });
    $('#heroH').innerHTML = '';
    T.hero.split(' ').forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'word';
      s.style.animationDelay = (0.08 + i * 0.07).toFixed(2) + 's';
      s.textContent = w;
      $('#heroH').appendChild(s);
      $('#heroH').appendChild(document.createTextNode(' '));
    });
    $('#langCode').textContent = st.lang === 'en' ? 'EN' : 'VI';
    $$('.langitem').forEach(function (b) {
      var on = b.getAttribute('data-lang') === st.lang;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.querySelector('svg').style.display = on ? '' : 'none';
    });
    renderSteps();
    renderFaq();
    renderDemo();
  }

  $$('.if-win').forEach(function (el) { if (os === 'mac') el.style.display = 'none'; });
  $$('.if-mac').forEach(function (el) { if (os !== 'mac') el.style.display = 'none'; });

  // ---------- chuyển ngôn ngữ ----------
  var langBtn = $('#langBtn'), langMenu = $('#langMenu');
  function setMenu(open) { langMenu.hidden = !open; langBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
  langBtn.addEventListener('click', function () { setMenu(langMenu.hidden); });
  $('#langWrap').addEventListener('mouseleave', function () { if (!langMenu.hidden) setMenu(false); });
  $$('.langitem').forEach(function (b) {
    b.addEventListener('click', function () {
      st.lang = b.getAttribute('data-lang');
      setMenu(false);
      try { localStorage.setItem('chotto-lang', st.lang); } catch (e) {}
      renderText();
    });
  });

  $$('#tabs .tab').forEach(function (b) {
    b.addEventListener('click', function () { st.tab = b.getAttribute('data-tab'); st.step = 0; renderSteps(); });
  });

  // ---------- hero: tia sáng theo chuột ----------
  var beams = [[$('#b1'), 130, 26], [$('#b2'), 222, 16], [$('#b3'), 314, 8]];
  function moveBeams(px, py) {
    beams.forEach(function (b) { b[0].style.transform = 'translate3d(' + (px * b[2]) + 'px,' + (py * b[2] * 0.5) + 'px,0)'; });
  }
  $('#hero').addEventListener('mousemove', function (e) {
    var r = e.currentTarget.getBoundingClientRect();
    moveBeams(((e.clientX - r.left) / r.width - 0.5) * 2, ((e.clientY - r.top) / r.height - 0.5) * 2);
  });

  // ---------- hero: cửa sổ gõ link ----------
  var col = { bad: '#ff5a52', ok: '#3fd08a' };
  var rowEls = [];
  for (var r = 0; r < 3; r++) {
    var row = document.createElement('div');
    row.innerHTML = '<span></span><span style="color: #aab3c5; font-size: 15px; width: 150px; flex: none"></span><span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"></span>';
    $('#rows').appendChild(row);
    rowEls.push(row);
  }
  function renderDemo() {
    var smp = T.samples[st.s];
    var url = URLS[st.s];
    var typingDone = st.ch >= url.length;
    var shownRows = typingDone ? Math.min(3, Math.floor(st.t / 7)) : 0;
    var showVerdict = typingDone && st.t >= 28;
    $('#typed').textContent = url.slice(0, st.ch);
    smp.rows.forEach(function (rw, i) {
      var el = rowEls[i];
      el.setAttribute('style', 'display:flex; align-items:center; gap:12px; height:44px; padding:0 12px; border-radius:8px; transition: opacity .35s, transform .35s, filter .35s;' + (i < shownRows ? 'opacity:1; transform:none; filter:none' : 'opacity:0; transform: translateY(6px); filter: blur(4px)'));
      el.children[0].setAttribute('style', 'width:8px; height:8px; border-radius:50%; flex:none; background:' + col[rw[2]] + '; box-shadow: 0 0 10px ' + col[rw[2]]);
      el.children[1].textContent = rw[0];
      el.children[2].textContent = rw[1];
    });
    $('#verdict').textContent = smp.verdict;
    $('#score').textContent = smp.score;
    $('#verdictBox').setAttribute('style', 'display:flex; align-items:center; gap:12px; height:48px; margin-top:4px; padding:0 12px; border-radius:8px; transition: opacity .4s, transform .4s; background:' + (smp.bad ? 'rgba(255,90,82,.12)' : 'rgba(63,208,138,.1)') + '; box-shadow: inset 0 0 0 1px ' + (smp.bad ? 'rgba(255,90,82,.3)' : 'rgba(63,208,138,.28)') + ';' + (showVerdict ? 'opacity:1; transform:none' : 'opacity:0; transform: translateY(6px)'));
    $('#verdictDot').setAttribute('style', 'width:10px; height:10px; border-radius:50%; flex:none; background:' + (smp.bad ? '#ff5a52' : '#3fd08a'));
  }
  setInterval(function () {
    var url = URLS[st.s];
    if (st.ch < url.length) st.ch = Math.min(url.length, st.ch + 2);
    else if (st.t < 110) st.t += 1;
    else { st.s = (st.s + 1) % URLS.length; st.ch = 0; st.t = 0; }
    renderDemo();
  }, 40);

  // ---------- phím Esc ----------
  var cap = $('#escCap'), win = $('#winBox'), busy = false;
  cap.addEventListener('click', function () {
    if (busy) return;
    busy = true;
    cap.classList.add('down');
    win.classList.add('winHide');
    setTimeout(function () { cap.classList.remove('down'); }, 180);
    setTimeout(function () { win.classList.remove('winHide'); busy = false; }, 1500);
  });

  // ---------- cuộn mượt + sáng mục trên thanh menu ----------
  var ids = ['cach-hoat-dong', 'tai-xuong', 'cai-dat', 'hoi-dap'];
  var navLock = false, navT = 0;
  function onScroll() {
    if (navLock) return;
    var cur = '';
    ids.forEach(function (id) { var el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= innerHeight * 0.4) cur = id; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = ids[ids.length - 1];
    if (cur !== st.sec) { st.sec = cur; renderNav(); }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = (a.getAttribute('href') || '').slice(1);
    var el = id && document.getElementById(id);
    if (!el) return;
    e.preventDefault();
    var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
    navLock = true;
    clearTimeout(navT);
    navT = setTimeout(function () { navLock = false; onScroll(); }, 1100);
    st.sec = id; renderNav();
  });
  window.addEventListener('scroll', onScroll, { passive: true });

  // ---------- khởi động ----------
  renderText();
  renderNav();
  onScroll();

  // ---------- hiện dần khi cuộn tới ----------
  try {
    document.documentElement.classList.add('rv-on');
    var els = $$('.rv');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('shown'); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
      els.forEach(function (el) { io.observe(el); });
    } else { els.forEach(function (el) { el.classList.add('shown'); }); }
    setTimeout(function () { $$('.rv').forEach(function (el) { if (el.getBoundingClientRect().top < innerHeight) el.classList.add('shown'); }); }, 1200);
  } catch (e) {}
})();
</script>
</body>
</html>
