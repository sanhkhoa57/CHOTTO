<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chotto · link mở từ Zalo</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shield.css">
<style>
/* Bảng màu pastel giống app.html: oải hương + cam đào, chữ tím đậm. Ghi đè nhánh sáng của shield.css. */
:root { color-scheme: light; --bg: #fbf6f1; --ink: #3a2547; --muted: #675a69; --line: rgba(58, 37, 71, .09); --line-strong: rgba(58, 37, 71, .22); --accent: #f28a3a; --accent-hi: #f69a52; --accent-ink: #2b1400; }
body { background: #fbf6f1; color: #3a2547; }
.shell { height: 100vh; display: flex; flex-direction: column;
  background: radial-gradient(120% 55% at 100% 0%, #ffe3cf 0%, transparent 60%), radial-gradient(110% 50% at 0% 0%, #ebe3fb 0%, transparent 62%), #fbf6f1; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(58, 37, 71, .28) transparent; }
.scroll .sh { box-sizing: border-box; min-height: 100%; padding-bottom: 32px; }
.tb { color: #3a2547; }
.tb .ctl svg { stroke: #3a2547; }
.tb .ctl:hover { background: rgba(58, 37, 71, .07); }
.sh[data-theme="light"] { --bg: transparent; }          /* để lộ nền gradient của cửa sổ */
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="tb">
    <div class="drag pywebview-drag-region"><span class="mark" aria-hidden="true"><i></i><i></i></span><span data-i18n="f.tb">Chotto · link from Zalo</span></div>
    <button class="ctl" id="btnMin" data-i18n-attr="aria-label:f.min" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
    <button class="ctl close" id="btnX" data-i18n-attr="aria-label:f.x" aria-label="Close without opening the link"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
  </div>
  <div class="scroll" id="scroll" role="alertdialog" aria-labelledby="chotto-title"></div>
</div>
<script src="i18n.js"></script>
<script src="shield.js"></script>
<script src="friction.js"></script>
</body>
</html>
